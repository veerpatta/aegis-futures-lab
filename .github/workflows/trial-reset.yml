# Trial reset: start a new trial round at $10,000. Manual only.
#
# The trial account copies every trade idea with practice money (see
# lib/trial/engine.ts). When it hits its $2,000 drawdown stop it stays stopped
# until the owner runs this. Nothing is erased: open positions close at their
# last price, the ended round keeps its dates, final balance and the reason
# given here, and the app keeps showing every earlier round.

name: trial-reset

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type RESET to start a new round"
        required: true
      reason:
        description: "Why a new round (shown in the app)"
        required: true

permissions:
  contents: read

concurrency:
  group: trial-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/engine/trial-reset.ts
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TRIAL_RESET_CONFIRM: ${{ inputs.confirm }}
          TRIAL_RESET_REASON: ${{ inputs.reason }}
