# Build only. No production credentials, no execution, no deployment.
name: resilience-build
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  bundle:
    if: github.head_ref == 'aegis-resilience-watchdog'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/resilience/bundle.ts
      - run: node scripts/experiment/bundle-function.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: aegis-standby-bundles
          path: |
            dist/functions/aegisstandby.zip
            dist/functions/aegisexp.zip
          retention-days: 3
