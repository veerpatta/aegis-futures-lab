# Aegis Autopilot — surfaces the bot's own proposals for review. It does NOT merge.
#
# WHAT THIS USED TO DO, AND WHY IT STOPPED
#
# This workflow used to squash-merge any non-draft bot/* PR whose `bot-ci`
# commit status was green, 30 minutes after the weekly challenger opened it.
# Its own header said so plainly: "it removes the human from the path between a
# proven result and production."
#
# The justification was that "the statistical gates are UNCHANGED". They were —
# and that was the problem, because of which gates they were. The path that
# reached production ran through scripts/engine/promotion.ts: 60 closed shadow
# signals, profit factor 1.2, positive net in 2 regimes. No random-entry
# benchmark, no deflated Sharpe, no PBO, no purged CV.
#
# Phase 1 measured what that bar is worth. MNQ 2020 reached the 94.6th
# percentile of its matched random null and MNQ 2023 the 93.0th, and both are
# noise: with 17 cells, roughly one crossing p95 by chance is the expectation.
# Meanwhile lib/validation/promotionGate.ts — 150 trades, random-entry p95,
# DSR, PBO, purged CV, written specifically to stop weak evidence reaching
# production — was imported by no engine or workflow script at all.
#
# So the loop could put a stream live, unattended, on evidence the repo's own
# gate would refuse. Two other files asserted this could not happen:
# tiers.ts said the bot-editable blocks change "only ever via a human-merged
# PR", and weekly-challenger.yml said "nothing changes live paper params
# without a human merge". Both were false while the merge step existed. They
# are true again now, and the gate is wired into promotionReport(), so a stream
# with no benchmark reads not-promotable rather than promotable.
#
# The pace argument for merging was real and is worth answering directly:
# proven results should not sit in open PRs doing nothing. They still should
# not. That is what the Telegram summary below is for — the loop still runs,
# still searches, still proposes, and now tells you when something is waiting.
# The last step is a human reading it.
#
# BOT_POLICY_FREEZE still governs the engine's own reflexes.
# Paper only, delayed data — nothing here touches real money.

name: autopilot

on:
  schedule:
    - cron: "30 4 * * 0"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read

concurrency:
  group: autopilot
  cancel-in-progress: false

jobs:
  autopilot:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # Report only. Read-only token scopes above make merging impossible here
      # rather than merely disabled — a kill switch that can be flipped back on
      # by setting a repo variable is not the same as removing the capability.
      - name: List bot proposals awaiting review
        id: review
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          prs=$(gh pr list --repo "$GH_REPO" --state open --json number,headRefName,isDraft,headRefOid \
            --jq '.[] | select(.isDraft == false) | select(.headRefName|startswith("bot/")) | [.number,.headRefName,.headRefOid] | @tsv')
          if [ -z "$prs" ]; then
            echo "no open bot proposals — the normal outcome on a week when nothing survived the gate"
            echo "ready=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          ready=""
          while IFS=$'\t' read -r num ref sha; do
            [ -z "${num:-}" ] && continue
            # challenger.ts drafts a PR when its own CI went red, so a draft is
            # a proposal that already failed. Those are filtered out above.
            state=$(gh api "repos/$GH_REPO/commits/$sha/status" \
              --jq '[.statuses[] | select(.context=="bot-ci")] | last | .state // "missing"')
            echo "PR #$num ($ref): bot-ci=$state"
            if [ "$state" = "success" ]; then
              ready="$ready #$num"
            fi
          done <<< "$prs"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Telegram summary
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          READY: ${{ steps.review.outputs.ready }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -uo pipefail
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ] || [ -z "${TELEGRAM_CHAT_ID:-}" ]; then
            echo "no telegram credentials — skipping"
            exit 0
          fi
          if [ -n "${READY:-}" ]; then
            msg="Autopilot: bot proposals${READY} passed bot-ci and are waiting for your review at https://github.com/${GH_REPO}/pulls — nothing was merged. Check the promotion gate's verdict in the PR body before merging."
          else
            msg="Autopilot ran: no proposal is ready for review. Nothing changed."
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" -d text="$msg" >/dev/null || true
