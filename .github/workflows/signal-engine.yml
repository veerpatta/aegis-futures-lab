# Scheduled paper-signal engine: recomputes the tier A/B signal streams from
# delayed Yahoo data and mirrors them into Neon for the dashboard.
#
# Cron is UTC and GitHub delays cron jobs by 5-15 min — fine for a paper
# log, never rely on it for live execution.
#
# COVERAGE: the whole Globex week, not just the entry window. Two crons,
# because cron cannot follow DST:
#
#   */15 * * * 1-5      every hour Mon-Fri UTC
#   */15 22-23 * * 0    the Sunday reopen — Globex opens 18:00 ET, which is
#                       22:00 UTC in EDT and 23:00 UTC in EST
#
# Saturday is empty: the market is shut for all of Saturday UTC in either
# regime. Friday evening UTC is over-covered by an hour or two after the
# 21:00/22:00 close; those passes just write an ordinary heartbeat.
#
# WHY THIS IS SAFE TO WIDEN. Entries are gated to 02:00-15:25 ET INSIDE the
# strategies (lib/strategies/rsi-reversion.ts, lib/strategies/zone-v5/index.ts),
# so an overnight pass physically cannot mint an out-of-window trade — verified
# against the live table: all 20 rows in `signals` sit between 02:25 and 15:20
# ET. Every pass is already a full recompute of the trailing 7 days from bars
# that already include the overnight session, so running more often adds no new
# bar ranges — only fresher zones, which is what the app has always claimed
# happens overnight.
#
# WHAT IT REQUIRED. "Now" is a TRADING day, not a calendar day: after 18:00 ET
# the session belongs to the next weekday. run-live.ts keys its daily funnel on
# lib/time/ny.ts `tradingDayKey` for exactly that reason.
#
# The pooled Neon database URL is stored as a GitHub Actions secret.

name: signal-engine

on:
  schedule:
    - cron: "*/15 * * * 1-5"
    - cron: "*/15 22-23 * * 0"
  workflow_dispatch:

concurrency:
  group: signal-engine
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsx scripts/engine/run-live.ts
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Ring 1 kill switch: "1" freezes breakers/veto (existing pauses stay).
          BOT_POLICY_FREEZE: ${{ vars.BOT_POLICY_FREEZE }}
          # Optional preregistered paper-shadow study ID; unset keeps capture off.
          AI_SHADOW_STUDY_ID: ${{ vars.AI_SHADOW_STUDY_ID }}
      - name: Publish complete market batch and process virtual account
        run: |
          npx tsx scripts/experiment/publish.ts
          npx tsx scripts/experiment/run.ts tick
        env:
          DATABASE_URL: ${{ secrets.NEON_DATABASE_URL }}

  # Independent of the signal engine: an AI outage never fails or delays it.
  # Both flags must be set deliberately; the endpoint separately verifies auth.
  ai-shadow-scheduler:
    if: ${{ vars.AI_SHADOW_SCHEDULER_ENABLED == 'true' && vars.AI_SHADOW_STUDY_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Process one prospective shadow idea
        env:
          AI_SHADOW_CRON_SECRET: ${{ secrets.AI_SHADOW_CRON_SECRET }}
        run: |
          if [[ ! "$AI_SHADOW_CRON_SECRET" =~ ^[A-Za-z0-9_-]{32,128}$ ]]; then
            echo "::warning::AI shadow scheduler secret missing or invalid"
            exit 0
          fi
          if ! printf 'header = "Authorization: Bearer %s"\n' "$AI_SHADOW_CRON_SECRET" |
            curl --config - --proto '=https' --silent --show-error --fail --max-time 70 --output /dev/null \
              'https://aegis-futures-lab-khaki.vercel.app/api/ai/shadow/cron'; then
            echo "::warning::AI shadow scheduler request failed; signal processing continues"
          fi
