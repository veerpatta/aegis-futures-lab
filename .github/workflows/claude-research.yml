# Claude as the bot's research assistant — measures everything, changes nothing.
#
# Two schedules, one file:
#   06:15 UTC daily  — read the night's evidence, append to docs/research-log.md,
#                      open an issue for anything anomalous.
#   07:00 UTC Sunday — the hypothesis loop: propose three falsifiable claims,
#                      write the diagnostics that would refute them, run them,
#                      report which survived.
#
# THE AUTHORITY BOUNDARY, which is the whole design: Claude may create and edit
# ONLY `scripts/diag/**` and `docs/research/**` + `docs/research-log.md`. It can
# compute anything and change nothing that affects a trade. No LLM in the signal
# path — surviving hypotheses go into the existing challenger machinery, which
# still demands out-of-sample evidence, a Monte-Carlo tail gate and two-week
# confirmation before any parameter moves.
#
# SECRET: `CLAUDE_CODE_OAUTH_TOKEN` — generated by running `claude setup-token`
# locally. This runs on the Claude Max subscription rather than API credits (a
# paid subscription does NOT include API/Console usage; they are separate billing
# tracks). Max limits are shared with interactive Claude use, so keep this to the
# two short runs a day it is scheduled for; `--max-turns` caps the worst case.
#
# If the first run fails on authentication, the fallback is one line: the action
# also accepts the OAuth token through the `anthropic_api_key` input, so swap
# `claude_code_oauth_token:` for `anthropic_api_key:` keeping the same secret.
# (`claude_code_oauth_token` is the purpose-built input in the action's own
# action.yml, which is why it is used here.)
#
# Paper only, delayed data. Nothing here touches real money.

name: claude-research

on:
  schedule:
    - cron: "15 6 * * *"
    - cron: "0 7 * * 0"
  workflow_dispatch:
    inputs:
      mode:
        description: "nightly | hypothesis"
        required: false
        default: "nightly"

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: claude-research
  cancel-in-progress: false

jobs:
  nightly:
    if: github.event.schedule == '15 6 * * *' || inputs.mode == 'nightly'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: "--max-turns 25"
          prompt: |
            You are the Aegis research analyst. Paper futures bot, MES/MNQ, delayed
            data, no real money. Write for a trader who knows markets, not software.

            READ (you have bash, node 22 and npm ci already done; SUPABASE_KEY is in
            the environment and `scripts/engine/*.ts` show how to query):
            - engine_runs for the last 26 hours: errors, bar ages, heartbeat messages.
            - signals and shadow_signals closed in the last 24 hours, with tier,
              regime, fill_confidence, win_prob, model_veto, stale_data.
            - learned_stats: the newest gate_costs, fill_reality, condition_ledger,
              shadow_scoreboard, score_calibration, daily_funnel payloads.
            - model_registry: the newest row and the trend in train_n and oos_brier
              against baseline_brier.
            - the last 20 lines of docs/research-log.md, so you do not repeat yourself.

            THEN APPEND to docs/research-log.md — a dated entry, at most twelve lines,
            in this spirit: what changed, what it means, and explicitly what it does
            NOT yet mean. Print n beside every claim. State when the honest answer is
            "no new information today"; that is a valid and frequent entry, and a log
            full of manufactured insight is worse than a short one.

            JUDGEMENT RULES, all of which exist because breaking them produces noise:
            - An engine_runs error is a defect only if it is STILL happening. Check
              whether later runs succeeded before calling anything broken.
            - Weekend and holiday runs reporting stale data are the bar-age gate
              WORKING, not a fault.
            - Tier A firing rarely is its measured nature: 16 trades over 51 archive
              sessions, clustered, 14 of them on 2026-07-09. A quiet week is expected.
            - score_calibration is empty for a STRUCTURAL reason — zone scores come
              only from zone-v5, which is tier A — so it cannot fill while tier A is
              silent. Do not report it as a bug or as a sample-size wait.
            - challenger verdict "none" is the normal weekly outcome.

            OPEN A GITHUB ISSUE (label `research`) ONLY IF one of these is true, and
            name which in the title: a live error class is recurring; a stream's
            rolling PF over its last 20 closed signals is below 0.8 and bot_policy
            shows no breaker pause (a broken safety net outranks everything);
            weekday-session bar age exceeded 30 minutes; the doubtful-fill share is
            trending up, which means the fill model is turning optimistic and every
            lesson downstream of it is suspect; or an expected learned_stats key is
            missing for the newest date, which means nightly-learn degraded silently.

            YOU MAY ONLY WRITE docs/research-log.md, docs/research/** and
            scripts/diag/**. Never touch scripts/engine/tiers.ts, lib/**, tests/**,
            .github/** or any migration. Before committing run `npx tsc --noEmit` and
            `npm test`; if either fails, commit nothing and say so in the issue.
            Never weaken a test or cast to any to make a check pass. Commit with a
            message naming what you learned, and push to main.

  hypothesis:
    if: github.event.schedule == '0 7 * * 0' || inputs.mode == 'hypothesis'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        env:
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SERVICE_KEY }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          claude_args: "--max-turns 60"
          prompt: |
            You are the Aegis research desk. Once a week you do the thing nobody has
            time for: turn vague suspicion into a measured answer.

            THE JOB. Propose THREE falsifiable hypotheses about why this bot makes or
            loses money, write the diagnostic that would REFUTE each one, run them,
            and report which survived. You are graded on refuting your own ideas, not
            on confirming them. A week where all three die is a good week — you have
            eliminated three explanations.

            CONTEXT WORTH KNOWING BEFORE YOU GUESS (read the files, do not trust this
            summary): `scripts/engine/tiers.ts` documents that MNQ's tier-B
            underperformance is NOT a sizing artefact — dollar-ATR is 2.68× MES, risk
            sizing already equalises it, MNQ is pinned at qty 1 by integer contract
            quantisation and is chronically UNDER-risked, and the daily-loss lock is
            unreachable because maxTrades/maxLosses always bind first. That gap is win
            rate, i.e. edge. `scripts/diag/PHASE1-FINDINGS.md` documents the
            archive-alignment defect that made two runs on identical data disagree by
            80%. Do not re-derive either; build on them.

            THE STANDING QUEUE — start here before inventing new questions, in order:
            1. EXIT AND MANAGEMENT REPLAY. `lib/backtest/whatif.ts` plus the bar
               archive can replay every closed signal under alternative management:
               stop to breakeven after 1R, ATR trailing, time stop at N bars, partial
               at 1R with a runner, session-close exit at various minutes. This uses
               data you ALREADY have — every closed real and shadow signal — so it can
               answer this week rather than next quarter. Management rules are where
               profit factor usually hides. Report a table: variant, trades, PF, net,
               win rate, p95 drawdown, and the same at 2× assumed slippage.
            2. TIME-OF-DAY AND DAY-OF-WEEK EXPECTANCY per stream, over the archive and
               the shadow fleet together so the n is in the hundreds, not the tens.
               Restrictions overfit far less than additions — dropping the worst hours
               is a stronger move than adding a parameter.
            3. COST SENSITIVITY. Re-run the live config at 2× and 3× slippage. A
               strategy that dies at 2× was never an edge.
            4. REGIME EXPECTANCY per stream using context_daily (VIX/DXY/TNX). Measure
               only; do not propose a gate until a bucket holds ~30+ trades.

            METHOD RULES. Search on the train window only and validate on held-out
            data; never report an in-sample number as evidence. Exclude stale_data and
            doubtful-fill rows from every conclusion — a lesson learned from a fill you
            do not believe is not a lesson. Print n beside every number and say
            plainly when n is too small: "insufficient" is a finding. Where a result
            depends on one date or one cluster, say so — the tier-A baseline looked
            like a rate until someone noticed 14 of 16 trades were on a single day.

            OUTPUT. Write each diagnostic as a runnable script under scripts/diag/
            (self-documenting header: what it asks, how to reproduce, what would refute
            it). Write findings to docs/research/<YYYY-MM-DD>-hypotheses.md. Open ONE
            GitHub issue (label `research`) titled with the week and listing each
            hypothesis as SURVIVED or REFUTED with its numbers, plus — only for
            survivors with adequate n — the specific change you would propose and the
            exact gate it must pass. Do not open a PR that changes trading behaviour;
            that is the challenger's job and it has gates you do not.

            AUTHORITY. You may write ONLY scripts/diag/**, docs/research/** and
            docs/research-log.md. Never touch scripts/engine/tiers.ts, lib/**,
            tests/**, .github/** or migrations — if a hypothesis needs a code change to
            test, write it as a standalone script in scripts/diag/ instead. Run
            `npx tsc --noEmit` and `npm test` before committing; if either fails,
            commit nothing and report it. Never weaken a test to get green. Push to
            main when clean.
